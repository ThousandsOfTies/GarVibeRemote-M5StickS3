[platformio]
default_envs = sticks3-usb
extra_configs = ../../.gar/composition/board.ini

[env:sticks3-usb]
extends = board
extra_scripts = pre:scripts/shared_ui.py
lib_deps =
    ${board.lib_deps}
    lvgl/lvgl@7.11.0
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.3.6
build_flags =
    ${board.build_flags}
    -std=gnu++17
